# Uma VPS com tudo: app + Evolution API + n8n, atrás do Caddy (HTTPS automático).
# Uso: cp infra/.env.example infra/.env, preencher, e `docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build`
# O banco do produto continua no Supabase; o Postgres daqui guarda só os dados internos da Evolution e do n8n.

services:
  app:
    build:
      context: ..
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        VITE_AGENTE_WHATSAPP: ${AGENTE_WHATSAPP}
        VITE_EXIGIR_ASSINATURA: ${EXIGIR_ASSINATURA:-false}
    restart: unless-stopped
    environment:
      PORT: 3000
      APP_URL: https://${DOMINIO_APP}
      MARCA_NOME: ${MARCA_NOME}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      AGENT_API_KEY: ${AGENT_API_KEY}
      VERIFICACAO_SEGREDO: ${VERIFICACAO_SEGREDO}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      WHATSAPP_BOTOES: ${WHATSAPP_BOTOES:-}
      CHATWOOT_URL: ${CHATWOOT_URL:-}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-}
    depends_on: [evolution]

  evolution:
    image: ${EVOLUTION_IMAGE:-atendai/evolution-api:v2.2.3}
    restart: unless-stopped
    environment:
      SERVER_URL: https://${DOMINIO_EVOLUTION}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances
    depends_on: [postgres, redis]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: ${DOMINIO_N8N}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMINIO_N8N}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Usadas no workflow: {{$env.APP_INTERNAL_URL}}, {{$env.AGENT_API_KEY}} etc.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      APP_INTERNAL_URL: http://app:3000
      AGENT_API_KEY: ${AGENT_API_KEY}
      EVOLUTION_INTERNAL_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on: [postgres]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO_APP: ${DOMINIO_APP}
      DOMINIO_N8N: ${DOMINIO_N8N}
      DOMINIO_EVOLUTION: ${DOMINIO_EVOLUTION}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app, n8n, evolution]

volumes:
  evolution_instances:
  n8n_data:
  postgres_data:
  redis_data:
  caddy_data:
