# nginx do servidor da Clemente: calculonamao.com.br -> app em 127.0.0.1:3010.
# Instalar: cp para /etc/nginx/sites-enabled/calculonamao, `nginx -t && systemctl reload nginx`,
# depois `certbot --nginx -d calculonamao.com.br -d www.calculonamao.com.br` (ativa o HTTPS).
server {
    listen 80;
    listen [::]:80;
    server_name calculonamao.com.br www.calculonamao.com.br;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
